import groovy.json.JsonSlurper
import groovy.json.JsonOutput
def props = new Properties()
file('../../version.properties').withInputStream { props.load(it) }
version=props.version
group='com.scouter.oceansdelight'
base.archivesName='oceansdelight'
sourceSets.main.resources.srcDir '../../common/src/main/resources'
def generatedJava=layout.buildDirectory.dir('generated/version/java')
sourceSets.main.java.srcDir generatedJava
tasks.register('generateVersion') {
 inputs.property('modVersion',project.version);outputs.dir generatedJava
 doLast {
  def out=new File(generatedJava.get().asFile,'com/scouter/oceansdelight/legacy/BuildVersion.java');out.parentFile.mkdirs()
  out.text="package com.scouter.oceansdelight.legacy; public final class BuildVersion { public static final String VERSION = \"${project.version}\"; private BuildVersion() {} }\n"
 }
}
compileJava.dependsOn 'generateVersion' 
def fd=file('../../../FarmersDelight-Legacy')
def fdProps=new Properties(); new File(fd,'version.properties').withInputStream { fdProps.load(it) }
dependencies { compileOnly files(new File(fd,"versions/${minecraftTarget}/build/devlibs/farmersdelight-${fdProps.version}+mc${minecraftTarget}-dev.jar")) }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
processResources {
 inputs.property('modVersion',project.version); inputs.property('minecraftTarget',minecraftTarget)
 inputs.dir file('../../src/main/resources');inputs.dir file('../../src/generated/resources')
 filesMatching('mcmod.info') { expand(modVersion:project.version,minecraftTarget:minecraftTarget) }
 doLast {
  def roots=[file('../../src/main/resources'),file('../../src/generated/resources')]
  def dest=destinationDir
  def writeJson={ String path,Object value -> def out=new File(dest,path);out.parentFile.mkdirs();out.setText(JsonOutput.toJson(value),'UTF-8') }
  def recipes=[:],tags=[:],models=[:],states=[:]
  roots.each { source ->
   fileTree(new File(source,'data/oceansdelight/recipes')).matching { include '**/*.json' }.files.sort().each { f ->
    def id='oceansdelight:'+new File(source,'data/oceansdelight/recipes').toPath().relativize(f.toPath()).toString().replace('\\','/').replaceAll(/\.json$/,'')
    def json=new JsonSlurper().parse(f)
    if(json.type=='forge:conditional') {
     if(json.recipes.size()!=1 || json.recipes[0].conditions.any { it.type!='forge:mod_loaded' || it.modid!='farmersdelight' }) throw new GradleException("Unsupported optional recipe condition: ${id}")
     json=json.recipes[0].recipe
    }
    recipes[id]=json
   }
   fileTree(new File(source,'data')).matching { include '*/tags/items/**/*.json' }.files.each { f ->
    def parts=new File(source,'data').toPath().relativize(f.toPath()).toString().replace('\\','/').split('/tags/items/')
    def id=parts[0]+':'+parts[1].replaceAll(/\.json$/,'');def tag=new JsonSlurper().parse(f)
    if(tags[id]) tags[id].values.addAll(tag.values);else tags[id]=tag
   }
   ['item':'items','block':'blocks'].each { modern,nativeDir -> copy { from new File(source,'assets/oceansdelight/textures/'+modern);into new File(dest,'assets/oceansdelight/textures/'+nativeDir) } }
   fileTree(new File(source,'assets/oceansdelight/models')).matching { include '**/*.json' }.files.each { f -> models[new File(source,'assets/oceansdelight/models').toPath().relativize(f.toPath()).toString().replace('\\','/')]=new JsonSlurper().parse(f) }
   fileTree(new File(source,'assets/oceansdelight/blockstates')).matching { include '*.json' }.files.each { f -> states[f.name]=new JsonSlurper().parse(f) }
  }
  writeJson('oceansdelight/source_recipes.json',recipes);writeJson('oceansdelight/source_tags.json',tags)
  def languages = [:]
  roots.each { resourceRoot ->
   fileTree(new File(resourceRoot, 'assets/oceansdelight/lang')).matching { include '*.json' }.files.sort().each { languageFile ->
    String locale = languageFile.name[0..-6].toLowerCase(Locale.ROOT)
    if (!(locale ==~ /[a-z]{2}_[a-z]{2}/)) throw new GradleException("Invalid locale: ${languageFile}")
    if (!languages.containsKey(locale)) languages[locale] = [:]
    languages[locale].putAll(new JsonSlurper().parse(languageFile, 'UTF-8'))
   }
  }
  def english = languages.en_us
  def catalog = new JsonSlurper().parse(file('../../common/src/main/resources/oceansdelight/foods.json'), 'UTF-8')
  def expected = catalog.collect { entry -> (entry.kind == 'block' ? 'block.' : 'item.') + 'oceansdelight.' + entry.id }
  expected.addAll(['guardian_soup'].collect { 'block.oceansdelight.' + it })
  expected.addAll(['guardian'].collect { 'item.oceansdelight.' + it })
  def missing = expected.findAll { !english?.get(it)?.trim() }
  if (missing) throw new GradleException("Missing English display names: ${missing.join(', ')}")

  languages.each { locale, translations ->
   String nativeLocale = minecraftTarget == '1.12.2' ? locale : locale[0..2] + locale[3..4].toUpperCase(Locale.ROOT)
   def legacy = [:]
   translations.each { key, value ->
    String nativeKey = key.startsWith('block.') ? 'tile.' + key.substring(6) : key
    if (nativeKey.startsWith('tile.') || nativeKey.startsWith('item.')) {
     nativeKey = nativeKey.replaceFirst(/(?:\.name)+$/, '') + '.name'
    }
    if (legacy.containsKey(nativeKey)) throw new GradleException("Duplicate ${locale} translation: ${nativeKey}")
    legacy[nativeKey] = value
   }
   def languageFile = new File(dest, "assets/oceansdelight/lang/${nativeLocale}.lang")
   languageFile.parentFile.mkdirs()
   languageFile.setText(legacy.collect { key, value -> "${key}=${value}" }.join('\n') + '\n', 'UTF-8')
  }
  models.each { path,json ->
   if(minecraftTarget=='1.12.2' && json.textures) json.textures=json.textures.collectEntries { k,v -> [(k):v.replace('farmersdelight:block/','oceansdelight:block/')] }
   if(json.textures) json.textures=json.textures.collectEntries { k,v -> [(k):v.replace(':block/',':blocks/').replace(':item/',':items/')] }
   if(json.parent?.startsWith('minecraft:')) json.parent=json.parent.substring('minecraft:'.length())
   // The feast models contain explicit cuboids, also read by FD's 1.7.10 native renderer.
   if(path.startsWith('block/') || minecraftTarget=='1.12.2') writeJson('assets/oceansdelight/models/'+path,json)
  }
  if(minecraftTarget=='1.12.2') states.each { path,json ->
   json.variants.values().each { v -> v.model=v.model.replace('oceansdelight:block/','oceansdelight:') }
   writeJson('assets/oceansdelight/blockstates/'+path,json)
  }
 }
}

jar {
 from('../../LICENSE.txt') { into 'META-INF'; rename { 'LICENSE-OceansDelight.txt' } }
 manifest { attributes 'Implementation-Title':"Ocean's Delight Legacy",'Implementation-Version':project.version }
 preserveFileTimestamps=false; reproducibleFileOrder=true
 archiveFileName="oceansdelight-${project.version}+mc${minecraftTarget}-dev.jar"
 destinationDirectory=layout.buildDirectory.dir('devlibs')
}
tasks.matching { it.name in ['remapJar','reobfJar'] }.configureEach {
 archiveFileName="oceansdelight-${project.version}+mc${minecraftTarget}.jar"
 destinationDirectory=layout.buildDirectory.dir('libs')
}
def production=providers.provider { tasks.named(minecraftTarget=='1.7.10' ? 'reobfJar' : 'remapJar').get() }
tasks.register('release',Sync) {
 dependsOn production
 from production.flatMap { it.archiveFile }
 into layout.buildDirectory.dir('release')
 doFirst {
  def jar=production.get().archiveFile.get().asFile
  def zip=new java.util.zip.ZipFile(jar)
  try {
   ['mcmod.info','oceansdelight/foods.json','oceansdelight/source_recipes.json','oceansdelight/source_tags.json','com/scouter/oceansdelight/legacy/OceansDelight.class','com/scouter/oceansdelight/legacy/GuardianSoup.class','assets/oceansdelight/textures/items/tentacles.png'].each { if(!zip.getEntry(it)) throw new GradleException("Missing distribution entry: ${it}") }
   zip.entries().each { e -> if(e.name.startsWith('vectorwing/') || e.name.startsWith('net/minecraft/') || e.name.endsWith('.java')) throw new GradleException("Bundled dependency/source: ${e.name}") }
   // Inspect the production archive after Forge reobfuscation/remapping.
   def languageDir = new File(processResources.destinationDir, 'assets/oceansdelight/lang')
   def expectedLanguages = fileTree(languageDir).matching { include '*.lang' }.files
   def archiveLanguages = zip.entries().findAll { !it.directory && it.name.startsWith('assets/oceansdelight/lang/') }
   if (!expectedLanguages || archiveLanguages.size() != expectedLanguages.size()) {
    throw new GradleException("Incorrect packaged oceansdelight locale count: ${archiveLanguages*.name}")
   }
   expectedLanguages.each { languageFile ->
    def entry = zip.getEntry("assets/oceansdelight/lang/${languageFile.name}")
    def packaged = entry ? zip.getInputStream(entry).withCloseable { it.getText('UTF-8') } : null
    if (packaged != languageFile.getText('UTF-8')) {
     throw new GradleException("Missing or altered distribution locale: ${languageFile.name}")
    }
   }
  } finally { zip.close() }
 }
}
tasks.named('build') { dependsOn 'release' }
